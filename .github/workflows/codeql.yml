name: "CodeQL"

on:
  push:
    branches: [ main ]
    # Documentation-only changes: no code analysis needed.
    # The weekly scan (schedule) runs regardless.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  # NO paths-ignore here: `Analyze (java-kotlin)` is a check REQUIRED by
  # `main`'s branch protection. If skipped, it reports no status and blocks the PR
  # indefinitely. The filter stays on `push`, where there is nothing to reanalyze.
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Composite action rather than a standalone setup-java: it brings the
      # Gradle cache. Read-only: this workflow consumes the cache written by
      # build.yml without inflating the repository's budget.
      - name: Setup Java + Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: java-kotlin
          build-mode: autobuild
          # security-and-quality suite.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:java-kotlin"
