name: "CodeQL"

on:
  push:
    branches: [ main ]
    # Changements purement documentaires : pas d'analyse de code nécessaire.
    # Le scan hebdomadaire (schedule) tourne de toute façon.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  # PAS de paths-ignore ici : `Analyze (java-kotlin)` est un check REQUIS par la
  # protection de `main`. Skippé, il ne rapporte aucun statut et bloque la PR
  # indéfiniment. Le filtre reste sur `push`, où il n'y a rien à réanalyser.
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Composite action plutôt qu'un setup-java isolé : elle apporte le cache
      # Gradle. En lecture seule : ce workflow consomme le cache écrit par
      # build.yml sans gonfler le budget du dépôt.
      - name: Setup Java + Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: java-kotlin
          build-mode: autobuild
          # Suite security-and-quality.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:java-kotlin"
