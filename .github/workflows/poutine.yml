name: Pipeline SAST (poutine)

# Static analysis of the CI/CD workflows themselves (GitHub Actions) with
# BoostSecurity's poutine: detects pipeline misconfigurations --
# command injection, dangerous use of pull_request_target, Dependabot
# "pwn request", unpinned actions, etc. Results are published in
# Security -> Code scanning (SARIF format). Does not fail the build: it
# surfaces findings for triage.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  # Periodic scan: re-checks the existing workflows with the latest
  # poutine rules, even without a new push (Monday 04:00 UTC).
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  poutine:
    name: Pipeline analysis (poutine)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: poutine - GitHub Actions SAST
        uses: boostsecurityio/poutine-action@e240ebd3eff8b2db5a8e5f6b28f58739d7db2247 # v1.1.4

      - name: Upload poutine SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
