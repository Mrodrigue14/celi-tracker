name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  # No paths-ignore here: "Build & test" is a required check in main's branch protection,
  # and a skipped workflow never reports a status, which blocks the PR.
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java + Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          cache-read-only: "false"

      # Runs before the tests: seconds, against minutes.
      - name: Style Kotlin
        run: ./gradlew ktlintCheck

      - name: Tests + coverage
        run: ./gradlew koverVerify :engine:koverHtmlReport -PwarningsAsErrors=true

      # Catches resource and manifest errors that neither the tests nor koverVerify see.
      - name: Lint Android
        run: ./gradlew :app:lintDebug

      - name: Publish coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: engine/build/reports/kover/html/
          retention-days: 14

      - name: Test report (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report
          path: '**/build/reports/tests/'
          retention-days: 7
