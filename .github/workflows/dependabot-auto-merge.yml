name: Dependabot auto-merge

# Auto-merges Dependabot PRs once CI is green.
#
# SECURITY -- this workflow follows GitHub's official pattern:
#
#   1. `pull_request` trigger (NEVER `pull_request_target`): the job has
#      no access to the repository's secrets.
#   2. NO `checkout` and no execution of the PR's code.
#   3. Author check via `github.event.pull_request.user.login` (the
#      non-forgeable field) and NOT `github.actor` (forgeable on
#      synchronize via `@dependabot recreate`).
#   4. No interpolation of controllable data in a `run:` -- only
#      `html_url`, generated by GitHub, passes through an environment variable.
#   5. Minimal permissions.
#
# The merge is delegated to GitHub's native auto-merge (`--auto`), which only
# completes if the checks required by branch protection pass. `main`'s branch
# protection requiring "Build & test" is therefore the real barrier: without it,
# this workflow would merge without a safety net.
#
# SCOPE: patch and minor only, all ecosystems. No major upgrade
# is auto-merged. No list of "uncovered" workflows to maintain --
# such a list silently goes stale and ends up letting through what
# it was meant to hold back.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: >
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
