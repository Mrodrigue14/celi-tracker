name: Dependency review

# GitHub Advanced Security component (free on public repos), similar to
# JFrog Xray's "policy gating": on every pull request, fails if the PR
# introduces a dependency with a known vulnerability (>= high) or a
# forbidden license. Covers declared dependencies (build.gradle.kts) and
# GitHub Actions via the dependency graph.
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Revue des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Blocks the PR if a new dependency has a high-severity CVE.
          fail-on-severity: high
          # Strongly copyleft licenses: incompatible with distributing
          # the app under PolyForm Shield (source-available, non-compete).
          # Blocks adding a dependency under any of these licenses.
          deny-licenses: >-
            GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later
