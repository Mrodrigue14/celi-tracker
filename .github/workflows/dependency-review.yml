name: Dependency review

# Composante GitHub Advanced Security (gratuite sur repo public), analogue au
# "policy gating" de JFrog Xray : à chaque pull request, échoue si la PR
# introduit une dépendance avec une vulnérabilité connue (>= high) ou une
# licence interdite. Couvre les dépendances déclarées (build.gradle.kts) et les
# actions GitHub via le graphe de dépendances.
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Revue des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Bloque la PR si une nouvelle dépendance a une CVE de sévérité élevée.
          fail-on-severity: high
          # Licences fortement copyleft : incompatibles avec la distribution de
          # l'application sous PolyForm Shield (source-available, non-compete).
          # Bloque l'ajout d'une dépendance sous l'une de ces licences.
          deny-licenses: >-
            GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later
