name: Setup Java + Gradle
description: >-
  Temurin JDK, Gradle (with cache) and an executable gradlew. Factors out the
  setup block repeated by the workflows, so a JDK version or action change
  happens in a single place.

inputs:
  java-version:
    description: Version of the Temurin JDK to install.
    required: false
    default: "21"
  cache-read-only:
    description: >-
      Do not WRITE the Gradle cache (true by default). Only build.yml should
      write it: this avoids accumulating multi-GB caches that would blow the
      repository's 10 GB budget.
    required: false
    default: "true"

# The internal actions are pinned to their commit SHA (tag in a comment):
# without that, pinning THIS composite action would give no guarantee, since
# it would pull mutable components. Dependabot updates the SHA + comment
# automatically.
runs:
  using: composite
  steps:
    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      with:
        cache-read-only: ${{ inputs.cache-read-only }}

    - name: Make gradlew executable
      shell: bash
      run: chmod +x gradlew
